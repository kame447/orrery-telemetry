name: Issue 33 read verification
on:
  push:
    branches: [fix/issue33-dashboard-live-read-scope]
    paths: [.github/workflows/issue33-read-verification.yml]
permissions:
  contents: write
jobs:
  focused:
    if: github.repository == 'kame447/orrery-telemetry'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified source candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 5c061e67318724bf5102f12cd9dfecbccc4c7cd7
          mkdir -p "$RUNNER_TEMP/issue33-read"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          assert os.environ['GITHUB_REPOSITORY'] == 'kame447/orrery-telemetry'
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/issue33-dashboard-live-read-scope'
          baseline = 'c876a3f02abb022e42e12779f07d9105bf2d6449'
          reference = '5c061e67318724bf5102f12cd9dfecbccc4c7cd7'
          helper = '.github/workflows/issue33-read-verification.yml'
          changed = subprocess.check_output(['git', 'diff', '--name-only', baseline, 'HEAD'], text=True).splitlines()
          assert changed == [helper], changed
          encoded = '''
          
          
          
          
          '''
          payload = lzma.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == 'dcdfee380316cd173037b602dbaf4924e4219f735a424524612a24c284b0ffa1', digest
          data = json.loads(payload)
          sources = []
          for kind, path in data['sources']:
              revision = {'c': baseline, 'r': reference}[kind]
              sources.append(subprocess.check_output(['git', 'show', revision + ':' + path]).decode().splitlines(True))
          for path, expected, chunks in data['files']:
              target = pathlib.Path(path)
              assert not target.is_absolute() and '..' not in target.parts
              content = ''.join(chunk if isinstance(chunk, str) else ''.join(sources[chunk[0]][chunk[1]:chunk[1] + chunk[2]]) for chunk in chunks).encode()
              assert hashlib.sha256(content).hexdigest() == expected, path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
          paths = [entry[0] for entry in data['files']]
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'rm', '--', helper], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue33-read'
          (out / 'source-manifest.json').write_text(json.dumps({'parent': os.environ['GITHUB_SHA'], 'transport_sha256': digest, 'files': [[p, sha] for p, sha, _ in data['files']]}, indent=2))
          (out / 'exact.diff').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--full-index', baseline, '--', '.', ':!' + helper]))
          print('Verified exact candidate:', len(paths), 'files')
          PY
      - name: Install isolated test dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install tmux uv
          python3 -m venv .venv
          .venv/bin/python -m pip install pytest pytest-asyncio pytest-timeout pytest-xdist build -e ./packages/agentstack_mail
      - name: Focused gate
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/lib/agentstack-register.sh bin/agentstack-preregister-child
          .venv/bin/python -m py_compile dashboard/server.py
          PYTHONPATH=.:packages/agentstack_mail/src .venv/bin/python -m pytest -q -n auto --dist loadfile \
            tests/test_dashboard_read_scope.py tests/test_dashboard_read_metadata.py \
            tests/test_dashboard_session_attribution.py tests/test_dashboard_live_read_scope.py \
            tests/test_dashboard_claude_liveness.py tests/test_dashboard_codex_liveness.py \
            tests/test_dashboard_identity_link.py tests/test_dashboard_demo.py \
            tests/test_graph_project_scope.py tests/test_graph_live_lineage.py tests/test_graph_timestamp_compat.py \
            tests/test_name_substitution_visible.py tests/test_transcript_ownership.py \
            tests/test_codex_transcript_prefers_session_index.py tests/test_spawn_v2.py \
            integrations/codex_app/tests/test_daemon.py \
            tests/test_codex_app_packaging.py::test_launchd_bootstrap_failure_uses_supervised_background \
            2>&1 | tee "$RUNNER_TEMP/issue33-read/focused.log"
      - name: Create tested commit object without moving a branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --check
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'kame447/orrery-telemetry'
          parent = os.environ['GITHUB_SHA']
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue33-read'
          def api(path, body=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=None if body is None else json.dumps(body).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          branch = api('/git/ref/heads/fix/issue33-dashboard-live-read-scope')['object']['sha']
          assert branch == parent, (branch, parent)
          entries = []
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          for path in filter(None, paths):
              target = pathlib.Path(path)
              if not target.exists():
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', path], text=True).split()[0]
              blob = api('/git/blobs', {'content': base64.b64encode(target.read_bytes()).decode(), 'encoding': 'base64'})
              expected = subprocess.check_output(['git', 'hash-object', '--', path], text=True).strip()
              assert blob['sha'] == expected, path
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          base_tree = api('/git/commits/' + parent)['tree']['sha']
          tree = api('/git/trees', {'base_tree': base_tree, 'tree': entries})['sha']
          assert tree == subprocess.check_output(['git', 'write-tree'], text=True).strip()
          commit = api('/git/commits', {'message': 'fix: isolate Dashboard read APIs and display metadata by project', 'tree': tree, 'parents': [parent]})
          result = {'parent': parent, 'sha': commit['sha'], 'tree': tree, 'focused': 'success', 'branch_moved': False, 'files': [e['path'] for e in entries]}
          (out / 'candidate.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue33-read-verification
          path: ${{ runner.temp }}/issue33-read/
          retention-days: 2
