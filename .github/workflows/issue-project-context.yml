name: Create project context issue

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/issue-project-context.yml

permissions:
  contents: read
  issues: write

jobs:
  create-issue:
    if: github.repository == 'kame447/orrery-telemetry'
    runs-on: ubuntu-latest
    steps:
      - name: Create issue if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          title='Project context が別リポジトリの設定を引き継ぐことがある'
          existing="$(gh issue list --repo "$GH_REPO" --state all --search 'project context project key' --json number,title --jq '.[] | select(.title == "Project context が別リポジトリの設定を引き継ぐことがある") | .number' | head -n1)"
          if [ -n "$existing" ]; then
            echo "Issue already exists: #$existing"
            exit 0
          fi
          cat > /tmp/issue-body.md <<'EOF'
          ## 概要

          複数リポジトリで Orrery を利用した際、現在の作業リポジトリとは異なる既存の project key が使われ、ORRERY Mail 上の project context がずれる事象を確認した。

          PR #13 の監査中、Orrery の worktree で作業しているエージェントが、StudyPlanner の project namespace に登録されていた。

          ## 問題

          現在の project context 解決では、既存の installed env に保存された project key が、実際の起動ディレクトリ / Git worktree より優先される場合がある。

          その結果、複数リポジトリを並行利用すると以下が混在する可能性がある。

          - agent registration
          - ORRERY Mail
          - file reservation
          - agent history / summary
          - Dashboard の project 表示
          - agent handoff / coordination state

          ## 期待する動作

          project context は現在の repository / worktree を基準に一貫して解決する。

          想定する優先順位:

          1. 明示的な per-invocation project key
          2. current repository / worktree
          3. project-scoped config
          4. install-time fallback

          ## 確認・修正対象

          - hooks/project-context.sh の project key 解決規則
          - installed env と current worktree の優先順位
          - linked worktree の扱い
          - agent-start
          - agent-start-codex
          - Antigravity launcher
          - Dashboard NEW AGENT
          - child spawn

          これらで同じ project-resolution rule を利用する。

          ## 受け入れ条件

          - 別リポジトリの project key が既存設定に残っていても、現在の repository から起動した agent は正しい project に登録される
          - linked worktree でも一貫して解決される
          - Claude / Codex / Antigravity / Dashboard で同じ規則を使う
          - 別リポジトリの agent / reservation が混入しない
          - multi-repository / linked-worktree の回帰テストを追加する

          ## 発見経緯

          PR #13 の Gemini NEW AGENT 統合監査中に発見。Gemini 統合そのものとは独立した project-context / coordination 基盤側の問題として追跡する。
          EOF
          sed -i 's/^          //' /tmp/issue-body.md
          gh issue create --repo "$GH_REPO" --title "$title" --body-file /tmp/issue-body.md
