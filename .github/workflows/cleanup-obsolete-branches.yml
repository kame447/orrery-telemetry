name: Cleanup obsolete branches

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cleanup-obsolete-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'kame447/orrery-telemetry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact branch tips and delete obsolete branches
        shell: bash
        run: |
          set -euo pipefail

          check_branch() {
            local branch="$1"
            local expected="$2"
            local actual
            actual="$(git ls-remote --heads origin "refs/heads/${branch}" | awk '{print $1}')"
            if [[ -z "$actual" ]]; then
              echo "branch missing before cleanup: $branch" >&2
              exit 1
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "branch moved: $branch expected=$expected actual=$actual" >&2
              exit 1
            fi
          }

          check_branch 'ci/cancel-superseded-runs' 'ba95f5d4334b06cb9e014d8a8b581198e8f11884'
          check_branch 'feat/gemini-provider' '8ed7d1bda17528078b733c669cf1ed4941385145'
          check_branch 'feat/gemini-provider-upstream' '7299711490107311d1ebe0586bab439c69f50857'
          check_branch 'tmp/gemini-readme-links' '13e18c6c4b68fe837f99b7bf5b905722abf1caf6'
          check_branch 'tmp/gemini-upstream-resume-guard' '89825ff5763f67bb9091e0ce81d627107a533fa0'
          check_branch 'tmp/gemini-upstream-server-patch' '489502d0d7bb036e1642c0ed37db2ae8ca49c102'
          check_branch 'upstream-master' '4161a3b963d5f056736e0a44ca472289303efe0d'

          branches=(
            'ci/cancel-superseded-runs'
            'feat/gemini-provider'
            'feat/gemini-provider-upstream'
            'tmp/gemini-readme-links'
            'tmp/gemini-upstream-resume-guard'
            'tmp/gemini-upstream-server-patch'
            'upstream-master'
          )

          for branch in "${branches[@]}"; do
            git push origin --delete -- "$branch"
          done
