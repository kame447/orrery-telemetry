name: Issue 33 final integration apply
on:
  push:
    branches: [fix/issue33-dashboard-control-isolation]
    paths: [.github/workflows/issue33-final-audit.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'kame447/orrery-telemetry'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed integration patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/issue33-final-part-00.patch \
            .github/issue33-final-part-01.patch \
            .github/issue33-final-part-02.patch \
            .github/issue33-final-part-03.patch \
            > "$RUNNER_TEMP/issue33-final.patch"
          git apply --check "$RUNNER_TEMP/issue33-final.patch"
          git apply "$RUNNER_TEMP/issue33-final.patch"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'AGENTS.md': 'fb146223522c05688d097be549d47eccf2f82b2f7352b7f514824b96b4606ca7',
              'claude/CLAUDE.md': '8799be9dcd1382937caefe89808f49367573cb513cba73be99ddfd79481f8027',
              'codex/AGENTS.md': '5370d3ea6c2d3425fe2c0dbd714afabd436dab810aa61e86ce28e21a05e26671',
              'scripts/doctor.sh': 'df437b2b3dd993392ca3afd67e8962f33b6968d8798371e32102cc98b84177dc',
              'scripts/install.sh': 'e12a10a80c3de4c39631dbb06693cf9d0005686f4754209df33d9659af5adb31',
              'scripts/dashboard-demo.py': 'bbe098422845a8e059a301bc515513c000a90d1d0938d5d294570051a799341e',
              'tests/test_dashboard_demo.py': 'aa11a91a931380717598720e0c97a089e4782a5bc0f41551b914eb4db58cf893',
              'tests/test_install_preflight.py': '7d6746489abff4e30c210e495bb9cf5d7f9e194387a8001e10991b6312a986e5',
              'tests/test_issue33_doctor_project_context.py': 'a0ab807836604f5a2b5749d6301736b2b58bfd1614953f5dbc3126069366dd16',
              'docs/configuration.md': '2c4fb0ab24faaf42da8945495061c9ad4f77db95d0706a71bb21c03c8240564f',
              'docs/configuration.en.md': 'd03de6c8b2c541b8020864302d39a5e94ac31363078cd747c095d57c49c5ba83',
              'docs/troubleshooting.md': '3c69ecce8d258520b985143e92f8fe4e43d012a8993ace1b40580d7be5c2c634',
              'docs/troubleshooting.en.md': 'd74a7b378c13f7f71d9fb310b700bccd230630f67f022a12e7d2e10ff50e5327',
              'docs/install.md': '4aca9d08a329368ea2b7c7d58c0ef4730efa833f6e1b51bf2fc73dc653e46072',
              'docs/install.en.md': 'f45052ae34b14e3bf023a1ef417ea318104ccf54030c60feb1150246953f3066',
          }
          for path, digest in expected.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'exact candidate mismatch for {path}: {actual} != {digest}')
          PY
          git diff --check
      - name: Focused final integration gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest pytest-timeout -e ./packages/agentstack_mail
          bash -n scripts/doctor.sh scripts/install.sh hooks/project-context.sh
          python -m py_compile \
            scripts/dashboard-demo.py \
            tests/test_dashboard_demo.py \
            tests/test_install_preflight.py \
            tests/test_issue33_doctor_project_context.py
          PYTHONPATH=.:packages/agentstack_mail/src python -m pytest -q \
            tests/test_install_preflight.py::test_explicit_project_key_is_selected_before_stale_ambient_project \
            tests/test_install_preflight.py::test_installed_project_fallback_is_not_parsed_before_python_preflight \
            tests/test_issue33_doctor_project_context.py \
            tests/test_doctor_report.py \
            tests/test_managed_coordination_rules.py \
            tests/test_dashboard_demo.py
      - name: Publish candidate without temporary verification files
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/issue33-final-audit.yml \
            .github/issue33-final-part-00.patch \
            .github/issue33-final-part-01.patch \
            .github/issue33-final-part-02.patch \
            .github/issue33-final-part-03.patch
          python - <<'PY'
          import subprocess
          temporary = {
              '.github/workflows/issue33-final-audit.yml',
              '.github/issue33-final-part-00.patch',
              '.github/issue33-final-part-01.patch',
              '.github/issue33-final-part-02.patch',
              '.github/issue33-final-part-03.patch',
          }
          lines = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          changed = {line[3:] for line in lines}
          if not temporary.issubset(changed):
              raise SystemExit('temporary verification files were not all scheduled for removal')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete project isolation integration checks'
          git push origin HEAD:fix/issue33-dashboard-control-isolation
