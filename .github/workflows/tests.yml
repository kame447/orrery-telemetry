name: issue33 phase5d preparation

on:
  push:
    branches: [work/issue33-phase5d-builder]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
          python3 -m pip install pytest pytest-timeout -e ./packages/agentstack_mail
      - name: Build and verify candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = kame447/orrery-telemetry
          BASE=2e8fcc9282fc27a3f078519d5f127337c02ff5da
          BUILDER="$PWD/scripts/issue33_phase5d_prepare.py"
          python3 - "$BUILDER" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          start = text.index("old_lifecycle = '''")
          end_marker = 'launch_path.write_text(launch.replace(old_lifecycle, new_lifecycle, 1), encoding="utf-8")\n'
          end = text.index(end_marker, start) + len(end_marker)
          replacement = """lifecycle_start = launch.index("def test_delegated_child_lifecycle_is_launcher_owned() -> None:\\n")
          lifecycle_end = launch.index("\\n\\ndef test_workspace_mcp_config_uses_child_local_git_exclude()", lifecycle_start)
          lifecycle = r'''def test_delegated_child_lifecycle_is_launcher_owned() -> None:
              text = _CHILD.read_text(encoding="utf-8")
              assert 'mail_helper reserve --project-key "$PROJECT_KEY"' in text
              assert '$(printf \'%q\' "$MAIL_HELPER") report --project-key' in text
              runner = text[text.index('cat > "$RUNNER_FILE" <<EOF'):text.index('chmod 700 "$RUNNER_FILE"')]
              assert '$(printf \'%q\' "$CLEANUP_HELPER") $(printf \'%q\' "$CHILD_NAME")' in runner
              assert '$(printf \'%q\' "$MAIL_HELPER") release --project-key' not in runner
              assert '$(printf \'%q\' "$MAIL_HELPER") retire --project-key' not in runner
              helper = _CHILD_MAIL.read_text(encoding="utf-8")
              assert 'registration_token=token' in helper
              assert 'subject_state = "complete" if status == "SUCCESS" else "incomplete"' in helper
              assert 'subject=f"Gemini child {subject_state}: {args.agent_name}"' in helper
              assert 'importance="normal" if status == "SUCCESS" else "high"' in helper
              assert 'path.stat().st_mode & 0o777' in helper
              assert 'if mode & 0o077:' in helper
          '''
          launch = launch[:lifecycle_start] + lifecycle + launch[lifecycle_end:]
          launch_path.write_text(launch, encoding="utf-8")
          """
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
          DIR=$(mktemp -d)
          git worktree add --detach "$DIR" "$BASE"
          cd "$DIR"
          python3 "$BUILDER" "$DIR"
          git diff --check
          bash -n hooks/spawn_gemini_preregistered.sh hooks/spawn_gemini_child.sh
          PYTHONPATH=.:packages/agentstack_mail/src python3 -m pytest -q \
            tests/test_phase5_gemini_child_ownership.py \
            tests/test_gemini_preregistered_cleanup.py \
            tests/test_gemini_launch.py \
            tests/test_gemini_child_headless.py \
            tests/test_gemini_bash32_syntax.py \
            tests/test_gemini_new_agent.py \
            tests/test_phase5_preregistered_handoff.py \
            tests/test_cleanup_child_agent.py
          EXPECTED=$(printf '%s\n' \
            docs/antigravity.en.md \
            docs/antigravity.md \
            hooks/spawn_gemini_child.sh \
            hooks/spawn_gemini_preregistered.sh \
            tests/test_gemini_launch.py \
            tests/test_gemini_preregistered_cleanup.py \
            tests/test_phase5_gemini_child_ownership.py | sort)
          ACTUAL=$( { git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^$' | sort -u)
          test "$ACTUAL" = "$EXPECTED" || { printf 'Unexpected diff:\n%s\n' "$ACTUAL"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/antigravity.en.md docs/antigravity.md \
            hooks/spawn_gemini_child.sh hooks/spawn_gemini_preregistered.sh \
            tests/test_gemini_launch.py tests/test_gemini_preregistered_cleanup.py \
            tests/test_phase5_gemini_child_ownership.py
          git commit -m 'fix: bind Gemini child lifecycle to validated ownership (issue33 phase5d)'
          git push origin HEAD:refs/heads/fix/issue33-gemini-child-ownership
          echo "PHASE5D_HEAD=$(git rev-parse HEAD)"
