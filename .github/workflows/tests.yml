name: issue33 phase5 ownership audit

on:
  push:
    branches: [work/issue33-phase5-audit]

concurrency:
  group: issue33-phase5-audit
  cancel-in-progress: true

jobs:
  stale-identity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pytest pytest-timeout -e ./packages/agentstack_mail
      - name: Reproduce stale AGENT_NAME vs schema-3 session binding
        env:
          PYTHONPATH: .:packages/agentstack_mail/src
        run: python3 -m pytest -q tests/test_phase5_stale_agent_identity_audit.py
