name: issue33 phase5d preparation

on:
  push:
    branches: [work/issue33-phase5d-builder]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
          python3 -m pip install pytest pytest-timeout -e ./packages/agentstack_mail
      - name: Build and verify candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = kame447/orrery-telemetry
          BASE=2e8fcc9282fc27a3f078519d5f127337c02ff5da
          BUILDER="$PWD/scripts/issue33_phase5d_prepare.py"
          DIR=$(mktemp -d)
          git worktree add --detach "$DIR" "$BASE"
          cd "$DIR"
          python3 "$BUILDER" "$DIR"
          git diff --check
          bash -n hooks/spawn_gemini_preregistered.sh hooks/spawn_gemini_child.sh
          PYTHONPATH=.:packages/agentstack_mail/src python3 -m pytest -q \
            tests/test_phase5_gemini_child_ownership.py \
            tests/test_gemini_preregistered_cleanup.py \
            tests/test_gemini_launch.py \
            tests/test_gemini_child_headless.py \
            tests/test_gemini_bash32_syntax.py \
            tests/test_gemini_new_agent.py \
            tests/test_phase5_preregistered_handoff.py \
            tests/test_cleanup_child_agent.py
          EXPECTED=$(printf '%s\n' \
            docs/antigravity.en.md \
            docs/antigravity.md \
            hooks/spawn_gemini_child.sh \
            hooks/spawn_gemini_preregistered.sh \
            tests/test_gemini_launch.py \
            tests/test_gemini_preregistered_cleanup.py \
            tests/test_phase5_gemini_child_ownership.py | sort)
          ACTUAL=$( { git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^$' | sort -u)
          test "$ACTUAL" = "$EXPECTED" || { printf 'Unexpected diff:\n%s\n' "$ACTUAL"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/antigravity.en.md docs/antigravity.md \
            hooks/spawn_gemini_child.sh hooks/spawn_gemini_preregistered.sh \
            tests/test_gemini_launch.py tests/test_gemini_preregistered_cleanup.py \
            tests/test_phase5_gemini_child_ownership.py
          git commit -m 'fix: bind Gemini child lifecycle to validated ownership (issue33 phase5d)'
          git push origin HEAD:refs/heads/fix/issue33-gemini-child-ownership
          echo "PHASE5D_HEAD=$(git rev-parse HEAD)"
