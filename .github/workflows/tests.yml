name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-regressions:
    name: provider regressions (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install pytest -e ./packages/agentstack_mail
      - name: Run provider and Gemini regressions
        run: |
          set -euo pipefail
          PYTHONPATH=.:packages/agentstack_mail/src python3 -m pytest -q tests/test_gemini_*.py tests/test_provider_*.py

  tests:
    # ORRERY is a macOS-first runtime. launchd/launchctl and the real tmux
    # binary are part of the tested contract, so Linux mixes harness failures
    # with product regressions.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Match upstream's supported interpreter floor. Python 3.10 imports,
        # but the mail-service suite still has known contract failures there.
        python-version: ["3.11", "3.12", "3.14"]
    name: tests (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
        with:
          # approved_base is accepted only when a persistent branch, remote, or
          # tag reaches it; shallow history would make that gate inconclusive.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # tmux is part of the launcher contract; uv provisions AgentStack Mail.
      - name: Install tmux and uv
        run: brew install tmux uv
      - name: Install test and package-build tools
        run: python3 -m pip install pytest build -e ./packages/agentstack_mail
      # `tests/` だけを指定していた間、integrations/codex_app/tests/ の 111 件は
      # 一度も CI で実行されていなかった。テストの置き場所が増えるたびに黙って
      # 対象から外れるので、ディレクトリは明示して数を数えられるようにする。
      - name: Run tests (pytest — `python3 file.py` 直実行は pytest 形式のテストを 0 件実行で緑にしてしまう)
        run: |
          set -euo pipefail
          PYTHONPATH=.:packages/agentstack_mail/src python3 -m pytest -q tests/ integrations/ packages/agentstack_mail/tests/
      - name: Build and inspect agentstack-mail distribution
        run: |
          set -euo pipefail
          python3 -m build packages/agentstack_mail --outdir /tmp/agentstack-mail-dist
          python3 packages/agentstack_mail/tests/verify_artifact.py /tmp/agentstack-mail-dist/agentstack_mail-0.0.0-py3-none-any.whl
          python3 packages/agentstack_mail/tests/verify_artifact.py /tmp/agentstack-mail-dist/agentstack_mail-0.0.0.tar.gz
          python3 -m pip install --force-reinstall --no-deps /tmp/agentstack-mail-dist/agentstack_mail-0.0.0-py3-none-any.whl
          python3 packages/agentstack_mail/tests/verify_installed_contract.py
