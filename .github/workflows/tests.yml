name: issue33 candidate preparation
on:
  push:
    branches: [work/issue33-github-split]
    paths: [work/candidate.patch]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install tmux uv
      - run: python3 -m pip install pytest pytest-timeout pytest-xdist build -e ./packages/agentstack_mail
      - name: Verify exact reviewed cleanup patch without changing existing candidate contents
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = kame447/orrery-telemetry
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          PATCH="$PWD/work/candidate.patch"
          DIR=$(mktemp -d)
          git worktree add --detach "$DIR" d57ec2e387c82fd920e2c2e03066d2ab18718580
          cd "$DIR"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_release_file_reservation.py')
          text = p.read_text()
          before = '            reserve_payload = json.dumps(\n                {\n                    "session_id": "session-1",'
          after = '            reserve_payload = json.dumps(\n                {\n                    "cwd": str(project),\n                    "session_id": "session-1",'
          assert text.count(before) == 1
          p.write_text(text.replace(before, after))
          PY
          git add tests/test_release_file_reservation.py
          test "$(git write-tree)" = 1ebd656f3a79a846d5aafba766342c92a4ad1200
          PYTHONPATH=.:packages/agentstack_mail/src python3 -m pytest -q tests/test_release_file_reservation.py
          git commit -m 'test: include actual cwd in reservation invalidation payload'
          git push origin HEAD:refs/heads/fix/issue33-reservation-workspace
          echo PHASE5A_FINAL_HEAD=$(git rev-parse HEAD)
          git cat-file commit HEAD
          git apply --index "$PATCH"
          test "$(git write-tree)" = 891feb6967a8e47978f53f6b1186bf5f3c9b803d
          git diff --cached --check
          PYTHONPATH=.:packages/agentstack_mail/src python3 -m pytest -q -n 3 --dist loadfile tests/test_cleanup_child_agent.py tests/test_phase4_registration_ownership.py tests/test_gemini_preregistered_cleanup.py tests/test_project_key_resolution.py tests/test_bash32_local_selfref.py tests/test_docs_consistency.py
          git commit -m 'fix: validate child ownership before retirement and local cleanup (issue33 phase5b)'
          git push origin HEAD:refs/heads/fix/issue33-child-cleanup
          echo PHASE5B_HEAD=$(git rev-parse HEAD)
          git cat-file commit HEAD
