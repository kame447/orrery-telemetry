name: issue33 phase5e preparation

on:
  push:
    branches: [work/issue33-phase5e-builder]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
          python3 -m pip install pytest pytest-timeout -e ./packages/agentstack_mail
      - name: Build and verify candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = kame447/orrery-telemetry
          BASE=0464e24930c16d3929f7cd30e36261416667eca5
          BUILDER="$PWD/scripts/issue33_phase5e_prepare_v2.py"
          DIR=$(mktemp -d)
          git worktree add --detach "$DIR" "$BASE"
          cd "$DIR"
          python3 "$BUILDER" "$DIR"
          git diff --check
          bash -n hooks/spawn_child.sh
          PYTHONPATH=.:packages/agentstack_mail/src python3 -m pytest -q \
            tests/test_phase5_direct_child_ownership.py \
            tests/test_phase5_preregistered_handoff.py \
            tests/test_cleanup_child_agent.py \
            tests/test_spawn_child_readiness.py \
            tests/test_spawn_child_embed_task.py \
            tests/test_child_shell_portability.py \
            tests/test_child_mcp_config.py \
            tests/test_codex_launch.py \
            tests/test_bash32_local_selfref.py
          EXPECTED=$(printf '%s\n' \
            docs/launchers.en.md \
            docs/launchers.md \
            hooks/spawn_child.sh \
            tests/test_phase5_direct_child_ownership.py | sort)
          ACTUAL=$( { git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^$' | sort -u)
          test "$ACTUAL" = "$EXPECTED" || { printf 'Unexpected diff:\n%s\n' "$ACTUAL"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/launchers.en.md docs/launchers.md hooks/spawn_child.sh \
            tests/test_phase5_direct_child_ownership.py
          git commit -m 'fix: bind direct child spawn to validated ownership (issue33 phase5e)'
          git push origin HEAD:refs/heads/fix/issue33-direct-child-ownership
          echo "PHASE5E_HEAD=$(git rev-parse HEAD)"
