name: issue33 phase5 preparation

on:
  push:
    branches: [work/issue33-phase5-prep]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: brew install tmux uv
      - run: python3 -m pip install pytest pytest-timeout pytest-xdist build -e ./packages/agentstack_mail
      - name: Apply and verify Phase 5 reservation workspace boundary
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "kame447/orrery-telemetry"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          DIR="$(mktemp -d)"
          git worktree add --detach "$DIR" efac3cf2affeedc2b2e7c990cd88b4792bdebb93
          cd "$DIR"
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/phase5.patch
          git apply --check /tmp/phase5.patch
          git apply /tmp/phase5.patch
          git diff --check
          bash -n hooks/reservation-common.sh hooks/invalidate-release-debounce.sh
          PYTHONPATH=.:packages/agentstack_mail/src python3 -m pytest -q tests/test_check_file_reservation.py tests/test_release_file_reservation.py
          git add hooks/reservation-common.sh hooks/invalidate-release-debounce.sh tests/test_check_file_reservation.py tests/test_release_file_reservation.py
          git commit -m 'fix: bind reservation paths to hook workspace context (issue33 phase5a)'
          git push origin HEAD:refs/heads/fix/issue33-reservation-workspace-boundary
          echo "PHASE5A_HEAD=$(git rev-parse HEAD)"
