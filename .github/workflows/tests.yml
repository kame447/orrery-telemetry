name: issue33 candidate preparation
on:
  push:
    branches: [work/issue33-github-split]
    paths: [work/candidate.patch]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install tmux uv
      - run: python3 -m pip install pytest pytest-timeout pytest-xdist build -e ./packages/agentstack_mail
      - name: Apply exact reviewed patch and verify before creating a candidate branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = kame447/orrery-telemetry
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          PATCH="$PWD/work/candidate.patch"
          DIR=$(mktemp -d)
          git worktree add --detach "$DIR" efac3cf2affeedc2b2e7c990cd88b4792bdebb93
          cd "$DIR"
          git apply --index "$PATCH"
          test "$(git write-tree)" = d33a3e4249e38ececbe361b541b730f0b84e005a
          git diff --cached --check
          PYTHONPATH=.:packages/agentstack_mail/src python3 -m pytest -q -n 3 --dist loadfile tests/test_reservation_project_scope.py tests/test_check_file_reservation.py tests/test_release_file_reservation.py tests/test_unmanaged_session_policy.py tests/test_bash32_local_selfref.py tests/test_docs_consistency.py
          git commit -m 'fix: derive reservation protection from the actual hook workspace (issue33 phase5a)'
          git push origin HEAD:refs/heads/fix/issue33-reservation-workspace
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"
