name: prepare isolated issue33 launcher candidate
on:
  push:
    branches: [work/issue33-top-level-launchers]
permissions:
  contents: write
concurrency:
  group: issue33-launcher-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'kame447/orrery-telemetry'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install tmux uv
      - run: python3 -m pip install pytest pytest-asyncio pytest-timeout pytest-xdist -e ./packages/agentstack_mail
      - name: Apply only the launcher slice to its pinned dependency
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:scripts/prepare-issue33-launchers.py" > "$RUNNER_TEMP/prepare-launchers.py"
          git checkout --detach b4d9cbe8586e4cb3f694a3ff422cc00c0c37e689
          git show "$GITHUB_SHA:bin/lib/agentstack-launch.sh" > bin/lib/agentstack-launch.sh
          git show "$GITHUB_SHA:tests/test_top_level_project_context.py" > tests/test_top_level_project_context.py
          python3 "$RUNNER_TEMP/prepare-launchers.py"
          git diff --check
          for f in bin/agent-start bin/agent-start-codex bin/agent-start-gemini bin/lib/agentstack-launch.sh; do bash -n "$f"; done
      - name: Focused and existing launcher regressions
        run: |
          set -euo pipefail
          PYTHONPATH=.:packages/agentstack_mail/src python3 -m pytest -q -n auto --dist loadfile \
            tests/test_top_level_project_context.py tests/test_identity_isolation.py \
            tests/test_invocation_context.py tests/test_invocation_project_key.py \
            tests/test_repository_identity.py tests/test_project_key_resolution.py \
            tests/test_service_label_isolation.py tests/test_bash32_local_selfref.py \
            tests/test_runtime_defaults.py tests/test_docs_consistency.py tests/test_gemini*.py
      - name: Publish a clean candidate without preparation tooling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {'bin/agent-start', 'bin/agent-start-codex', 'bin/agent-start-gemini',
                      'bin/lib/agentstack-launch.sh', 'hooks/README.md', 'docs/launchers.md',
                      'docs/launchers.en.md', 'tests/test_identity_isolation.py',
                      'tests/test_top_level_project_context.py'}
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          actual.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert actual == expected, (actual, expected)
          PY
          git config user.name 'kame447'
          git config user.email '76802107+kame447@users.noreply.github.com'
          git add -- bin/agent-start bin/agent-start-codex bin/agent-start-gemini bin/lib/agentstack-launch.sh \
            hooks/README.md docs/launchers.md docs/launchers.en.md tests/test_identity_isolation.py \
            tests/test_top_level_project_context.py
          git commit -m 'fix(launch): bind top-level invocations to resolved project context' \
            -m 'Depends on b4d9cbe8 (fork #36). Migrate only top-level launch and session handoff; preserve delegated consumers and defer ownership/session-index migration. Focused and existing launcher regressions ran on macOS Python 3.12 before this commit. Full exact-head matrix CI is still required. Refs gyroid-eth/orrery-telemetry#33.'
          git push origin HEAD:refs/heads/fix/issue33-top-level-launchers
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git diff --stat HEAD^ >> "$GITHUB_STEP_SUMMARY"
