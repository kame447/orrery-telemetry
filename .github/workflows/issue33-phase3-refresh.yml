name: Phase 3 dependency refresh (one-shot)

on:
  push:
    branches: [fix/issue33-reservation-workspace]
    paths: [.github/workflows/issue33-phase3-refresh.yml]

permissions:
  contents: write

concurrency:
  group: issue33-phase3-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'kame447/orrery-telemetry'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PHASE3: be1c86d78675dc2ba71ae299f2de7a4146809955
      OLD_PHASE2: 578a26779f6b6dee4d3ea604d37b04cf9be8163f
      PHASE2: 2803c0c744c8b100903e7e245d4ccca8a29b107e
      UPSTREAM: 7b2ca56243a73842514f99aa992955fa45e4859c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify refs and merge the current Phase 2 without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/issue33-reservation-workspace
          test "$(git rev-parse HEAD^)" = "$PHASE3"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin refs/heads/audit/issue33-minimal-core:refs/remotes/origin/phase2-refresh
          git fetch https://github.com/gyroid-eth/orrery-telemetry.git refs/heads/master:refs/remotes/upstream/phase3-refresh
          test "$(git rev-parse refs/remotes/origin/phase2-refresh)" = "$PHASE2"
          test "$(git rev-parse refs/remotes/upstream/phase3-refresh)" = "$UPSTREAM"
          git merge-base --is-ancestor "$UPSTREAM" "$PHASE2"
          git merge-base --is-ancestor "$OLD_PHASE2" "$PHASE3"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff "$PHASE2" -m 'Merge current Phase 2 and upstream into Phase 3 reservation isolation'
          git merge-base --is-ancestor "$UPSTREAM" HEAD
          git merge-base --is-ancestor "$PHASE2" HEAD
          git diff --check "$PHASE2" HEAD
          git diff --binary "$OLD_PHASE2" "$PHASE3" > "$RUNNER_TEMP/phase3-before.patch"
          git diff --binary "$PHASE2" HEAD -- . ':(exclude).github/workflows/issue33-phase3-refresh.yml' > "$RUNNER_TEMP/phase3-after.patch"
          cmp "$RUNNER_TEMP/phase3-before.patch" "$RUNNER_TEMP/phase3-after.patch"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/audit/issue33-minimal-core | cut -f1)" = "$PHASE2"
          test "$(git ls-remote https://github.com/gyroid-eth/orrery-telemetry.git refs/heads/master | cut -f1)" = "$UPSTREAM"
          git push origin HEAD:refs/heads/fix/issue33-reservation-workspace
          printf 'Merged HEAD: %s\n' "$(git rev-parse HEAD)"
          git diff --stat "$PHASE2" HEAD -- . ':(exclude).github/workflows/issue33-phase3-refresh.yml'
          printf 'Phase 3 patch is byte-identical to its previous 14-file unit.\n'
