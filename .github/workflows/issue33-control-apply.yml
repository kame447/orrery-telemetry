name: Issue 33 control patch diagnostic
on:
  push:
    branches: [fix/issue33-dashboard-control-isolation]
    paths: [.github/workflows/issue33-control-apply.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect fragment boundaries
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          shas = '''c1c31a7d2e61b91aa334016c40539759646c6dc9
          96ccffc48afd71e6a4a18f48147c18b56e19fb95
          1e6231b7807ba37ea00d8c36c736f9370aaf8d55
          cef5dd25eef752257e45bc4f6634dae327642ab0
          81d39d6bd22bb18fc7411b9024a7916bc7a13971
          684d91aed7c5b549f0c911b997f59b7690289f13
          d1d5367e0bbd44032b38a8bdc159cb2d8dd63078
          b4dc60dca69edb2a067f8502f279f5344183a512
          a721a6385c4817caeaefa72b2b8c955744046c09'''.split()
          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']; out=bytearray()
          for sha in shas:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=20) as r: data=base64.b64decode(json.load(r)['content'])
              print(sha, len(data), repr(data[:80]), repr(data[-80:]))
              out.extend(data)
          open('/tmp/control.patch','wb').write(out)
          PY
          echo '--- around parser failure ---'
          nl -ba /tmp/control.patch | sed -n '480,515p'
          git apply --check /tmp/control.patch || true
