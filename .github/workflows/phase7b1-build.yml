name: Phase 7b1 builder

on:
  push:
    branches:
      - work/issue33-phase7b1-builder

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue33-phase7b1-builder
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install pytest pytest-timeout -e ./packages/agentstack_mail
      - name: Fetch pinned reference source
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/kame447/orrery-telemetry/5c061e67318724bf5102f12cd9dfecbccc4c7cd7/dashboard/server.py \
            -o .phase7b1-reference-server.py
          mkdir -p .phase7b1-bin
          cat > .phase7b1-bin/git <<'EOF'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "show" && "${2:-}" == "5c061e67318724bf5102f12cd9dfecbccc4c7cd7:dashboard/server.py" ]]; then
            cat "$GITHUB_WORKSPACE/.phase7b1-reference-server.py"
            exit 0
          fi
          exec /usr/bin/git "$@"
          EOF
          chmod +x .phase7b1-bin/git
      - name: Build Phase 7b1 slice
        run: PATH="$PWD/.phase7b1-bin:$PATH" python3 .github/phase7b1-build.py
      - name: Focused attribution gate
        run: |
          set -euo pipefail
          python3 -m py_compile dashboard/server.py
          PYTHONPATH=.:packages/agentstack_mail/src python3 -m pytest -q \
            tests/test_dashboard_session_attribution.py \
            tests/test_graph_project_scope.py \
            tests/test_graph_live_lineage.py
      - name: Commit generated slice
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/server.py tests/test_dashboard_session_attribution.py
          git diff --cached --check
          git commit -m 'fix(dashboard): add project session attribution primitives'
          git push origin HEAD:work/issue33-phase7b1-builder
