name: issue33 phase5a harness fix

on:
  push:
    branches: [work/issue33-phase5a-harness-fix]

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: brew install tmux uv
      - run: python3 -m pip install pytest pytest-timeout pytest-xdist build -e ./packages/agentstack_mail
      - name: Preserve real context Python while faking only reservation renewal
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "kame447/orrery-telemetry"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_check_file_reservation.py')
          text = path.read_text()
          old = '''            "cat >/dev/null\\n"
                      "printf '%s\\\\n' 'HOOK_RENEWED: 0'\\n",
          '''
          new = '''            "if [ \\\"${1-}\\\" = \\\"-\\\" ]; then\\n"
                      "    shift\\n"
                      "    script=$(mktemp) || exit 1\\n"
                      "    trap 'rm -f \\\"$script\\\"' EXIT HUP INT TERM\\n"
                      "    cat >\\\"$script\\\"\\n"
                      "    if grep -q 'reservation-guard' \\\"$script\\\"; then\\n"
                      "        printf '%s\\\\n' 'HOOK_RENEWED: 0'\\n"
                      "        exit 0\\n"
                      "    fi\\n"
                      f"    exec {json.dumps(os.sys.executable)} - \\\"$@\\\" <\\\"$script\\\"\\n"
                      "fi\\n"
                      f"exec {json.dumps(os.sys.executable)} \\\"$@\\\"\\n",
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected shim block once, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 -m py_compile tests/test_check_file_reservation.py
          git diff --check
          PYTHONPATH=.:packages/agentstack_mail/src python3 -m pytest -q \
            tests/test_check_file_reservation.py \
            tests/test_release_file_reservation.py \
            tests/test_phase5_reservation_workspace_boundary.py
          git add tests/test_check_file_reservation.py
          git commit -m 'test: preserve real workspace resolution in reservation default harness'
          git push origin HEAD:refs/heads/fix/issue33-reservation-workspace-boundary
