name: issue33 review source
on:
  push:
    branches: [work/issue33-review-source]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export Phase 5b fork history for read-only review
        run: |
          set -eu
          git bundle create /tmp/orrery-phase5b-history.bundle refs/remotes/origin/fix/issue33-child-cleanup
          git bundle verify /tmp/orrery-phase5b-history.bundle
          sha256sum /tmp/orrery-phase5b-history.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: orrery-phase5b-history
          path: /tmp/orrery-phase5b-history.bundle
          retention-days: 1
