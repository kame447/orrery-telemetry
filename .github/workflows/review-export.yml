name: issue33 review source
on:
  push:
    branches: [work/issue33-review-source]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export current upstream history for read-only integration review
        run: |
          set -eu
          git fetch https://github.com/gyroid-eth/orrery-telemetry.git master:refs/remotes/review-upstream/master
          git bundle create /tmp/orrery-upstream-history.bundle refs/remotes/review-upstream/master
          git bundle verify /tmp/orrery-upstream-history.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: orrery-upstream-history
          path: /tmp/orrery-upstream-history.bundle
          retention-days: 1
      - name: Supply missing isolated tmux libraries and asynchronous test plugin
        run: |
          set -eu
          mkdir -p /tmp/orrery-extra-dependencies
          cd /tmp/orrery-extra-dependencies
          apt-get download libevent-core-2.1-7t64 libutempter0
          python3 -m pip wheel --wheel-dir . pytest-asyncio
          sha256sum * > checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: orrery-extra-dependencies
          path: /tmp/orrery-extra-dependencies/
          retention-days: 1
