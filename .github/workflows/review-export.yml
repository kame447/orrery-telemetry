name: issue33 review source
on:
  push:
    branches: [work/issue33-review-source]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export Git objects without local config or credentials
        run: |
          set -eu
          git bundle create /tmp/orrery-phase4-history.bundle refs/remotes/origin/fix/issue33-session-activation
          git bundle verify /tmp/orrery-phase4-history.bundle
          sha256sum /tmp/orrery-phase4-history.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: orrery-phase4-history
          path: /tmp/orrery-phase4-history.bundle
          retention-days: 1
      - name: Build offline test dependencies for Linux Python 3.13
        run: |
          set -eu
          mkdir -p /tmp/orrery-wheels
          python3 -m pip wheel --wheel-dir /tmp/orrery-wheels ./packages/agentstack_mail pytest pytest-timeout pytest-xdist build hatchling editables
          cd /tmp/orrery-wheels
          apt-get download tmux
          sha256sum * > checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: orrery-linux-test-dependencies
          path: /tmp/orrery-wheels/
          retention-days: 1
